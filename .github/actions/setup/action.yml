name: Set up the workspace
description: >-
  Node, pnpm, the workspace install, and the PostgreSQL client — the steps
  every job of this repository repeated verbatim, in one place. The Node
  version and the PostgreSQL major are pinned HERE, so they move once
  rather than in six jobs that could drift apart without anyone noticing.

  Checkout is NOT part of this: a local `./.github/actions/...` action is
  read out of the workspace, so the repository has to be on disk before the
  runner can see this file at all. Every caller therefore checks out first.

inputs:
  install:
    description: >-
      Run `pnpm install --frozen-lockfile`. Set to 'false' for a job that
      only needs Node itself — the census runs one script and no more.
    required: false
    default: 'true'
  postgres-client:
    description: >-
      Install the PostgreSQL 17 client. It matches the `postgres:17-alpine`
      service the jobs run against, which is what lets the backup/restore
      proof RUN instead of skipping on a tooling mismatch.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: 22.16.0

    # `corepack enable` alone: corepack reads the `packageManager` field of
    # package.json, which already pins the exact pnpm version, so naming it
    # a second time here only creates a second place for it to go stale.
    - name: Enable pnpm
      shell: bash
      run: corepack enable

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    # Bounded like the Playwright browser install in ci.yml (commit
    # aa95057), and for the same reason: a stalled connection to
    # apt.postgresql.org has held this step for a job's entire 20-minute
    # budget (observed three times on 2026-08-20), where a killed attempt
    # retried in seconds. Each attempt gets two minutes; three attempts;
    # then a loud named failure instead of a silently eaten job.
    - name: Install PostgreSQL 17 client
      if: ${{ inputs.postgres-client == 'true' }}
      shell: bash
      run: |
        install_pg_client() {
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS --max-time 60 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo timeout --kill-after=10 120 apt-get update -qq
          sudo timeout --kill-after=10 120 \
            apt-get install -y --no-install-recommends postgresql-client-17
        }
        for attempt in 1 2 3; do
          if install_pg_client; then exit 0; fi
          echo "pgdg install attempt ${attempt} failed or stalled; retrying" >&2
        done
        echo "pgdg install failed after 3 bounded attempts" >&2
        exit 1
        # /usr/bin/pg_dump is Debian's pg_wrapper and kept answering as the
        # image's preinstalled 16 even with 17 installed; put the real 17
        # binaries first on PATH for the steps that follow.
        echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
        /usr/lib/postgresql/17/bin/pg_dump --version
