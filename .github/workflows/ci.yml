name: CI

on:
  pull_request:
    # Owner decision, budget mode: this repository is private and its
    # monthly Actions allowance is two-thirds spent. A pull request that
    # only edits documentation cannot break a build, a type, a test or a
    # migration, so it does not buy the twenty-minute verify job.
    #
    # This filter is workflow-level, which is why the test census lives in
    # its own workflow (census.yml): the census is ~1 runner-minute and is
    # exactly the gate that should run on every pull request, docs or not.
    #
    # Caveat for whoever configures branch protection: a workflow skipped
    # by paths-ignore reports NO status at all rather than a passing one,
    # so `verify` must not be a required check unless a docs-only pull
    # request is expected to sit unmergeable. Require `census` instead —
    # it always runs.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # The heavy proofs (production-smoke, restore-fresh-cluster) run on demand
  # and weekly, not per pull request: they cost ~45 runner-minutes together
  # and prove deployment topology, not the changed code. The per-merge push
  # run was removed — it duplicated the pull request run minutes-for-minutes.
  workflow_dispatch:
  schedule:
    # Monday 03:30 UTC: the weekly full-topology proof.
    - cron: '30 3 * * 1'

permissions:
  contents: read

# A newer push to the same branch supersedes the running verification.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ONE Poppler version for the whole pipeline. The LOA parser and its
  # six-letter regression corpus are calibrated against a specific
  # `pdftotext -layout` behaviour, so "some Poppler" is not a dependency
  # specification. This is the version Ubuntu 24.04 ships, which is why the
  # jobs that need it pin `runs-on: ubuntu-24.04` rather than
  # `ubuntu-latest`: an image rollover would otherwise change the extractor
  # underneath the corpus without a single line of the repository changing.
  # The production image must install the same upstream version
  # (`deploy/Dockerfile.server`, currently an unpinned `apk add
  # poppler-utils`); until it does, CI and production can differ, and
  # apps/server/test/loa-extract-roundtrip.test.ts is what would notice.
  POPPLER_VERSION: '24.02.0'

jobs:
  # Deeper SAST (docs/SECURITY.md: required with the first authenticated
  # endpoint). Proves no match against Semgrep's curated p/ci rules for the
  # committed TypeScript/JavaScript and shell surface; scanning is local to
  # the runner (--metrics=off), only the rules are fetched.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install semgrep
        run: python3 -m pip install --quiet semgrep==1.172.0
      - name: Semgrep scan
        run: >-
          semgrep scan --config p/ci --metrics=off --error
          --exclude docs/reference
          --exclude packages/loa-parser/fixtures
          --exclude pnpm-lock.yaml

  # Browser accessibility/security smoke (docs/SECURITY.md: activates with
  # the first accepted browser workflow). Proves the production bundle
  # renders the auth/org/member screens with no serious axe violations and
  # keeps the tenant header on scoped requests; the API is mocked, so this
  # proves frontend behaviour, not server authorisation (the verify job's
  # integration tests prove that).
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm --filter @auto-mb/web exec playwright install --with-deps chromium
      - name: Build web bundle
        run: pnpm --filter @auto-mb/web build
      - name: Accessibility smoke
        run: pnpm --filter @auto-mb/web test:e2e

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auto_mb
          POSTGRES_USER: auto_mb_owner
          POSTGRES_PASSWORD: local-owner-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_mb_owner -d auto_mb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://auto_mb_owner:local-owner-change-me@127.0.0.1:5432/auto_mb
      DATABASE_URL: postgres://auto_mb_app:local-app-change-me@127.0.0.1:5432/auto_mb
      AUTO_MB_APP_DB_PASSWORD: local-app-change-me
      RESTORE_PROOF: required
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # pg_dump 17 matches the PostgreSQL service, so the backup/restore
      # proof RUNS here instead of skipping on tooling mismatch — CI green
      # must mean the restore actually happened (external review, ops
      # batch). RESTORE_PROOF=required turns any skip into a failure.
      - uses: ./.github/actions/setup
        with:
          postgres-client: 'true'
      # pdftotext (poppler-utils) is the LOA text-extraction system
      # dependency (docs/DEPENDENCIES.md); the server integration tests
      # exercise it against a real PDF upload, and
      # test/loa-extract-roundtrip.test.ts pins the layout behaviour the
      # parser reads. The version assertion is the pin: a runner image that
      # moved to a different Poppler fails here, loudly, instead of shipping
      # a differently-shaped item table into the corpus.
      - name: Install poppler-utils (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          installed="$(pdftotext -v 2>&1 | head -n 1)"
          echo "$installed"
          case "$installed" in
            *"version $POPPLER_VERSION"*) ;;
            *)
              echo "::error::Expected Poppler $POPPLER_VERSION, got: $installed."
              echo "Update POPPLER_VERSION in this workflow and deploy/Dockerfile.server together, then re-run apps/server/test/loa-extract-roundtrip.test.ts to confirm the layout behaviour did not move." >&2
              exit 1
              ;;
          esac
      # Proves shell scripts parse and follow shellcheck's static rules;
      # does not prove runtime behaviour on a cloud VM. Globbed via
      # git ls-files so new scripts cannot escape the gate.
      - name: Shell lint
        run: |
          git ls-files '*.sh' | xargs bash -n
          git ls-files '*.sh' | xargs shellcheck
      # Proves the compose file is structurally valid with default
      # interpolation; does not prove the services boot.
      - name: Compose config validation
        run: docker compose config --quiet
      # `pnpm verify` includes formatting, lint (with security rules),
      # typecheck, the web production bundle build, tests against the live
      # PostgreSQL service, migration validation, architecture checks,
      # config parse checks, and the secret scan.
      - name: Verify
        run: pnpm verify

  # Boots the PRODUCTION topology from scratch on every change: real
  # image builds, fresh volumes, the role/grant bootstrap, and the
  # readiness gate through Caddy — the deployment path itself is under
  # test, not just the application (external review, ops batch). The
  # gate waits out ClamAV's virus-database download and requires the
  # COMPLETE topology, scanner included (external re-audit) — green must
  # mean uploads scan.
  production-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compose up (build)
        run: |
          cat > deploy/.env.production <<'ENV'
          SITE_ADDRESS=localhost
          POSTGRES_PASSWORD=smoke-owner-password
          AUTO_MB_APP_DB_PASSWORD=smoke-app-password
          AUTH_SECRET=smoke-secret-0123456789abcdef0123456789abcdef
          METRICS_TOKEN=smoke-metrics-token
          ENV
          docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/.env.production up -d --build
      - name: Bootstrap database
        run: |
          set -a; . deploy/.env.production; set +a
          docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/.env.production exec -T \
            -e DATABASE_ADMIN_URL="postgres://auto_mb_owner:${POSTGRES_PASSWORD}@postgres:5432/auto_mb" \
            -e AUTO_MB_APP_DB_PASSWORD="${AUTO_MB_APP_DB_PASSWORD}" \
            -e DATABASE_URL="postgres://auto_mb_app:${AUTO_MB_APP_DB_PASSWORD}@postgres:5432/auto_mb" \
            server pnpm --filter @auto-mb/db bootstrap < /dev/null
      - name: Readiness through Caddy (complete, scanner included)
        run: |
          # ClamAV downloads its virus database on first boot — minutes,
          # not seconds. The gate is full readiness: HTTP 200 with every
          # configured component ok.
          body=''
          for attempt in $(seq 1 60); do
            body=$(curl -skS --connect-timeout 2 --max-time 5 \
              https://localhost/api/ready || true)
            echo "attempt $attempt: $body"
            case "$body" in
              *'"status":"ready"'*) break ;;
            esac
            sleep 10
          done
          echo "$body"
          echo "$body" | grep -q '"status":"ready"'
          echo "$body" | grep -q '"database":"ok"'
          echo "$body" | grep -q '"objectStorage":"ok"'
          echo "$body" | grep -q '"pdfRenderer":"ok"'
          echo "$body" | grep -q '"malwareScanner":"ok"'
      - name: Web bundle served
        run: >-
          curl -fskS --connect-timeout 2 --max-time 10 https://localhost/
          | grep -qi '<!doctype html>'
      - name: Sign-up works end to end
        run: |
          status=$(curl -skS --connect-timeout 2 --max-time 10 \
            -o /tmp/signup.json -w '%{http_code}' \
            -X POST https://localhost/api/auth/sign-up/email \
            -H 'Origin: https://localhost' \
            -H 'content-type: application/json' \
            -d '{"email":"smoke@example.test","password":"smoke-password-123","name":"Smoke Test"}')
          cat /tmp/signup.json
          test "$status" = "200"
      - name: Logs on failure
        if: ${{ failure() || cancelled() }}
        run: |
          docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/.env.production ps
          docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/.env.production logs --tail 80

  # Disaster-recovery proof on a TRULY fresh cluster (external re-audit):
  # the in-cluster restore test cannot see missing roles, lost SECURITY
  # DEFINER ownership, or ACLs referencing absent roles. Here the source
  # database is bootstrapped and backed up with the real scripts, then
  # restored onto a brand-new PostgreSQL 17 container that has none of
  # the application roles — following the documented sequence: roles
  # first, then restore, then the full bootstrap. Green means the
  # application role connects and the definer functions are owned
  # correctly on the rebuilt cluster.
  restore-fresh-cluster:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auto_mb
          POSTGRES_USER: auto_mb_owner
          POSTGRES_PASSWORD: local-owner-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_mb_owner -d auto_mb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://auto_mb_owner:local-owner-change-me@127.0.0.1:5432/auto_mb
      AUTO_MB_APP_DB_PASSWORD: local-app-change-me
      FRESH_ADMIN_URL: postgres://auto_mb_owner:fresh-owner-change-me@127.0.0.1:55432/auto_mb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          postgres-client: 'true'
      - name: Bootstrap and back up the source database
        run: |
          pnpm --filter @auto-mb/db bootstrap
          mkdir -p /tmp/source-objects
          echo restore-me > /tmp/source-objects/marker.txt
          BACKUP_ROOT=/tmp/backups OBJECT_STORAGE_DIR=/tmp/source-objects \
            bash scripts/backup.sh
      - name: Restore onto a brand-new cluster
        run: |
          docker run -d --name fresh-pg -p 55432:5432 \
            -e POSTGRES_USER=auto_mb_owner \
            -e POSTGRES_PASSWORD=fresh-owner-change-me \
            -e POSTGRES_DB=auto_mb \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec fresh-pg pg_isready -U auto_mb_owner -d auto_mb; then
              break
            fi
            sleep 2
          done
          # 1. Roles first: they are cluster-level and never travel in a
          #    database dump, but the dump's ACLs reference them.
          DATABASE_ADMIN_URL="$FRESH_ADMIN_URL" \
            pnpm --filter @auto-mb/db exec tsx src/bootstrap.ts --roles-only
          # 2. The restore itself, with the real script.
          # Directories only: the backup script also writes the last-success
          # marker FILE beside the timestamped directory (backup-age gauge).
          backup_dir=$(ls -d /tmp/backups/*/)
          RESTORE_DATABASE_URL="$FRESH_ADMIN_URL" \
            RESTORE_OBJECT_STORAGE_DIR=/tmp/restored-objects \
            bash scripts/restore.sh "$backup_dir"
          # 3. Full bootstrap: repairs grants and SECURITY DEFINER
          #    ownership, then proves an application-role connection.
          DATABASE_ADMIN_URL="$FRESH_ADMIN_URL" \
            DATABASE_URL="postgres://auto_mb_app:${AUTO_MB_APP_DB_PASSWORD}@127.0.0.1:55432/auto_mb" \
            pnpm --filter @auto-mb/db bootstrap
      - name: Prove the restored system
        run: |
          psql "postgres://auto_mb_app:${AUTO_MB_APP_DB_PASSWORD}@127.0.0.1:55432/auto_mb" \
            -v ON_ERROR_STOP=1 \
            -c "select count(*) as organisations from organisations" \
            -c "select p.proowner::regrole::text as owner from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = 'app_private'
                  and p.proname = 'create_organisation_with_owner'" \
            | tee /tmp/restore-proof.txt
          grep -q auto_mb_definer /tmp/restore-proof.txt
          test -f /tmp/restored-objects/marker.txt
      - name: Fresh-cluster logs on failure
        if: failure()
        run: docker logs fresh-pg --tail 60 || true
