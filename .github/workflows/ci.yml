name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: pnpm verify
