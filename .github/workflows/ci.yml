name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auto_mb
          POSTGRES_USER: auto_mb_owner
          POSTGRES_PASSWORD: local-owner-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_mb_owner -d auto_mb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://auto_mb_owner:local-owner-change-me@127.0.0.1:5432/auto_mb
      DATABASE_URL: postgres://auto_mb_app:local-app-change-me@127.0.0.1:5432/auto_mb
      AUTO_MB_APP_DB_PASSWORD: local-app-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
