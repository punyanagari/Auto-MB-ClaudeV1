name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch supersedes the running verification.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deeper SAST (docs/SECURITY.md: required with the first authenticated
  # endpoint). Proves no match against Semgrep's curated p/ci rules for the
  # committed TypeScript/JavaScript and shell surface; scanning is local to
  # the runner (--metrics=off), only the rules are fetched.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install semgrep
        run: python3 -m pip install --quiet semgrep==1.172.0
      - name: Semgrep scan
        run: >-
          semgrep scan --config p/ci --metrics=off --error
          --exclude docs/reference
          --exclude packages/loa-parser/fixtures
          --exclude pnpm-lock.yaml

  # Browser accessibility/security smoke (docs/SECURITY.md: activates with
  # the first accepted browser workflow). Proves the production bundle
  # renders the auth/org/member screens with no serious axe violations and
  # keeps the tenant header on scoped requests; the API is mocked, so this
  # proves frontend behaviour, not server authorisation (the verify job's
  # integration tests prove that).
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @auto-mb/web exec playwright install --with-deps chromium
      - name: Accessibility smoke
        run: pnpm --filter @auto-mb/web test:e2e

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auto_mb
          POSTGRES_USER: auto_mb_owner
          POSTGRES_PASSWORD: local-owner-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_mb_owner -d auto_mb"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://auto_mb_owner:local-owner-change-me@127.0.0.1:5432/auto_mb
      DATABASE_URL: postgres://auto_mb_app:local-app-change-me@127.0.0.1:5432/auto_mb
      AUTO_MB_APP_DB_PASSWORD: local-app-change-me
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Proves shell scripts parse and follow shellcheck's static rules;
      # does not prove runtime behaviour on a cloud VM. Globbed via
      # git ls-files so new scripts cannot escape the gate.
      - name: Shell lint
        run: |
          git ls-files '*.sh' | xargs bash -n
          git ls-files '*.sh' | xargs shellcheck
      # Proves the compose file is structurally valid with default
      # interpolation; does not prove the services boot.
      - name: Compose config validation
        run: docker compose config --quiet
      # `pnpm verify` includes formatting, lint (with security rules),
      # typecheck, the web production bundle build, tests against the live
      # PostgreSQL service, migration validation, architecture checks,
      # config parse checks, and the secret scan.
      - name: Verify
        run: pnpm verify
