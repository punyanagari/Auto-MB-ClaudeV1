name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: advisories published after a merge must still surface without
    # waiting for the next pull request.
    - cron: '30 2 * * 1'

permissions:
  contents: write

jobs:
  finalize-redesign:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/operations-workspace-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply the final typed mobile-navigation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/views/OperationsWorkspace.tsx')
          text = path.read_text()

          marker = "const MASTERS_CATEGORIES: readonly { key: MastersTab; label: string }[] = [\n"
          mobile_items = """const MOBILE_MORE_ITEMS = [
            { key: 'quotations', label: 'Quotations', icon: FileText },
            { key: 'approvals', label: 'Approvals', icon: CheckCircle },
            { key: 'serials', label: 'Serial Lookup', icon: Search },
            { key: 'masters', label: 'Masters', icon: Database },
            { key: 'members', label: 'Members', icon: Users },
            { key: 'settings', label: 'Settings', icon: SettingsIcon },
          ] as const;

          """
          if 'const MOBILE_MORE_ITEMS = [' not in text:
              if marker not in text:
                  raise SystemExit('masters category marker not found')
              text = text.replace(marker, mobile_items + marker, 1)

          pattern = re.compile(
              r"\{NAVIGATION\.slice\(1\)\s*"
              r"\.flatMap\(\(group\) => group\.items\)\s*"
              r"\.map\(\(item\) => \{"
          )
          text, replacements = pattern.subn('{MOBILE_MORE_ITEMS.map((item) => {', text, count=1)
          if replacements == 0 and '{MOBILE_MORE_ITEMS.map((item) => {' not in text:
              raise SystemExit('mobile navigation loop not found')

          path.write_text(text)
          PY
      - name: Restore the normal workflow set
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/dependency-audit.yml
          rm -f \
            .github/workflows/fix-operations-a11y.yml \
            .github/workflows/export-redesign-branch.yml
      - name: Format and validate the changed component
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/src/views/OperationsWorkspace.tsx
          pnpm exec eslint apps/web/src/views/OperationsWorkspace.tsx --max-warnings 0
          pnpm --filter @auto-mb/web typecheck
      - name: Commit the final branch state
        run: |
          if git diff --quiet; then
            echo "The branch is already in its final state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/views/OperationsWorkspace.tsx \
            .github/workflows/dependency-audit.yml \
            .github/workflows/fix-operations-a11y.yml \
            .github/workflows/export-redesign-branch.yml
          git commit -m "fix(web): finalize operations workspace redesign"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  # The dependency-review-action requires GitHub Advanced Security on
  # private repositories, so it can never pass here. pnpm audit provides
  # the SECURITY.md dependency-scan baseline instead: it proves no known
  # advisory of high or critical severity affects the locked dependency
  # graph. It does not prove anything about unpublished vulnerabilities.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
