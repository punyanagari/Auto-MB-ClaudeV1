name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  fix-overhaul-types:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-experience-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/product-experience-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply targeted compiler and lint corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path('apps/server/src/routes/contract-sources.ts')
          text = route.read_text()
          replacements = {
              'expectedTenderNumber: identity.tenderNumber ?? null,': 'expectedTenderNumber: identity.tenderNumber,',
              'expectedWorkDescription: identity.workDescription ?? null,': 'expectedWorkDescription: identity.workDescription,',
              'reviewTenderDocument(\n              extraction.content,': "reviewTenderDocument(\n              extraction.content.toString('utf8'),",
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f'route source not found: {before!r}')
              text = text.replace(before, after)
          route.write_text(text)

          review = Path('apps/web/src/views/ReviewLoa.tsx')
          text = review.read_text()
          before = """  const [supply, installation, pac, finalBill] = value
    .split('|')
    .map((part) => part.trim());
  return { supply, installation, pac, finalBill };
"""
          after = """  const [supply = '0', installation = '0', pac = '0', finalBill = '0'] = value
    .split('|')
    .map((part) => part.trim());
  return { supply, installation, pac, finalBill };
"""
          if before not in text:
              raise SystemExit('payment-matrix split source not found')
          review.write_text(text.replace(before, after, 1))

          terms = Path('apps/web/src/views/TenderTermsReview.tsx')
          text = terms.read_text()
          before = '  readonly proposedMatrix?: readonly PaymentMatrixEntry[];\n'
          after = '  readonly proposedMatrix: readonly PaymentMatrixEntry[] | undefined;\n'
          if before not in text:
              raise SystemExit('proposedMatrix prop source not found')
          terms.write_text(text.replace(before, after, 1))

          parser = Path('packages/loa-parser/src/tender-document.ts')
          text = parser.read_text()
          before = """function periodSuggestions(blocks: readonly string[]): readonly TenderPeriodSuggestion[] {
  const result: TenderPeriodSuggestion[] = [];
  for (const block of blocks) {
    const kind: TenderPeriodKind | null = /warrant(?:y|ies)|guarantee\\s+period/i.test(block)
      ? 'warranty'
      : /maintenance\\s+period|defect\\s+liability|AMC\\s+period/i.test(block)
        ? 'maintenance'
        : null;
"""
          after = """function periodKindOf(block: string): TenderPeriodKind | null {
  if (/warrant(?:y|ies)|guarantee\\s+period/i.test(block)) return 'warranty';
  if (/maintenance\\s+period|defect\\s+liability|AMC\\s+period/i.test(block)) {
    return 'maintenance';
  }
  return null;
}

function periodSuggestions(blocks: readonly string[]): readonly TenderPeriodSuggestion[] {
  const result: TenderPeriodSuggestion[] = [];
  for (const block of blocks) {
    const kind = periodKindOf(block);
"""
          if before not in text:
              raise SystemExit('period-kind source not found')
          parser.write_text(text.replace(before, after, 1))
          PY
          pnpm exec prettier --write \
            apps/server/src/routes/contract-sources.ts \
            apps/web/src/views/ReviewLoa.tsx \
            apps/web/src/views/TenderTermsReview.tsx \
            packages/loa-parser/src/tender-document.ts
          git show origin/main:.github/workflows/dependency-audit.yml > .github/workflows/dependency-audit.yml
      - name: Run focused checks
        run: |
          pnpm exec eslint \
            apps/server/src/routes/contract-sources.ts \
            apps/web/src/views/ReviewLoa.tsx \
            apps/web/src/views/TenderTermsReview.tsx \
            packages/loa-parser/src/tender-document.ts \
            --max-warnings 0
          pnpm typecheck
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: tighten tender intake type boundaries'
          git push origin HEAD:agent/product-experience-rebuild
