name: Deploy

# Deploys main to the production host after CI passes there. Does nothing
# until two repository secrets exist (Settings → Secrets and variables →
# Actions):
#   DEPLOY_HOST     the server's public IP (the Elastic IP)
#   DEPLOY_SSH_KEY  a dedicated OpenSSH private key whose public half is
#                   appended to /home/ubuntu/.ssh/authorized_keys on the
#                   host; rotate by replacing both halves
# The key exists only inside GitHub's encrypted secrets and the server;
# revoking it is one line out of authorized_keys.

on:
  # Deploys are a deliberate operator action (Run workflow), never a side
  # effect of a merge: audit finding 32 flagged auto-deploy-on-main, and
  # per-merge AWS deploys were never the intent. Run CI on the commit you
  # intend to ship before dispatching.
  workflow_dispatch:

# contents:read lets the job mint the ephemeral token the host uses to
# pull this private repository.
permissions:
  contents: read

# Deploys must not interleave; a queued newer deploy still runs after the
# current one so the host always converges on the latest main.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check secrets are configured
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST / DEPLOY_SSH_KEY not set; skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # The secret may hold the key either verbatim or base64-encoded
          # (one line, survives any clipboard); detect and normalise.
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key.in
          if grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key.in; then
            mv ~/.ssh/deploy_key.in ~/.ssh/deploy_key
          else
            tr -d ' \t\r\n' < ~/.ssh/deploy_key.in | base64 -d > ~/.ssh/deploy_key
            rm ~/.ssh/deploy_key.in
          fi
          chmod 600 ~/.ssh/deploy_key
          # Validate without leaking: shape stats plus the derived PUBLIC
          # key (safe to print; must match authorized_keys on the host).
          echo "key file: $(wc -c < ~/.ssh/deploy_key) bytes, $(wc -l < ~/.ssh/deploy_key) lines"
          if grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "shape: PEM/OpenSSH text"
          else
            echo "shape: no PEM header found"
          fi
          if ! ssh-keygen -y -f ~/.ssh/deploy_key; then
            echo "DEPLOY_SSH_KEY does not parse as a private key" >&2
            exit 1
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, rebuild, migrate, verify
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/deploy_key "ubuntu@$DEPLOY_HOST" \
            "sudo GITHUB_TOKEN='$GH_TOKEN' GITHUB_REPOSITORY='$GH_REPO' bash -s" <<'DEPLOY'
          set -euo pipefail
          cd /opt/auto-mb
          # The repository is private and this shell has no TTY to prompt
          # for credentials; fetch with the job's ephemeral read token,
          # which never touches the host's disk.
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          # The deploy checkout must track main exactly, but local edits on
          # the host (a hand-tweaked doc, a hot-fixed config) must not block
          # the deploy OR be destroyed: stash them aside, visibly, and keep
          # them recoverable via `git stash list` on the host.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "local changes on host; preserving them in a stash:"
            git status --short
            git stash push --include-untracked -m "deploy-autostash before $(git rev-parse --short FETCH_HEAD)"
          fi
          git merge --ff-only FETCH_HEAD
          docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/.env.production up -d --build
          set -a; . deploy/.env.production; set +a
          # Bootstrap = ensure application role + migrations + reapply the
          # canonical privilege matrix + prove an application-role query.
          # Idempotent and advisory-lock-guarded; safe on every deploy.
          docker compose -f deploy/docker-compose.prod.yml \
            --env-file deploy/.env.production exec -T \
            -e DATABASE_ADMIN_URL="postgres://auto_mb_owner:${POSTGRES_PASSWORD}@postgres:5432/auto_mb" \
            -e AUTO_MB_APP_DB_PASSWORD="${AUTO_MB_APP_DB_PASSWORD}" \
            -e DATABASE_URL="postgres://auto_mb_app:${AUTO_MB_APP_DB_PASSWORD}@postgres:5432/auto_mb" \
            server pnpm --filter @auto-mb/db bootstrap < /dev/null
          # (the </dev/null matters: without it, docker exec attaches to
          # this script's stdin and swallows the lines below)
          # The deploy is not done until the site answers READY — every
          # configured component, scanner included. Retries cover the
          # scanner's warm-up window after a container recreation.
          for attempt in $(seq 1 24); do
            if body=$(curl -fsSk --max-time 15 \
                --resolve "${SITE_ADDRESS}:443:127.0.0.1" \
                "https://${SITE_ADDRESS}/api/ready"); then
              echo "$body"
              echo "deploy verified: site is ready"
              exit 0
            fi
            echo "not ready yet (attempt $attempt)"
            sleep 10
          done
          echo "site did not become ready" >&2
          curl -sk --resolve "${SITE_ADDRESS}:443:127.0.0.1" \
            "https://${SITE_ADDRESS}/api/ready" || true
          exit 1
          DEPLOY
