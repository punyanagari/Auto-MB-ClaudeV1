name: Export product experience branch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/product-experience-rebuild

permissions:
  contents: read

concurrency:
  group: export-product-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Package repository checkout
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./branch-checkout.tar.gz' \
            -czf branch-checkout.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-experience-checkout
          path: branch-checkout.tar.gz
          if-no-files-found: error
          retention-days: 1
