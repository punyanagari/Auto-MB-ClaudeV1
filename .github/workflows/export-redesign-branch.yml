name: Export redesign branch

on:
  push:
    branches:
      - agent/operations-workspace-redesign

permissions:
  contents: read

concurrency:
  group: export-operations-workspace
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Package the complete branch checkout
        run: |
          tar \
            --exclude='./node_modules' \
            --exclude='./.pnpm-store' \
            --exclude='./branch-checkout.tar.gz' \
            -czf branch-checkout.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operations-workspace-checkout
          path: branch-checkout.tar.gz
          if-no-files-found: error
          retention-days: 1
