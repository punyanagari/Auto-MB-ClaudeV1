name: Fix operations workspace branch

on:
  push:
    branches:
      - agent/operations-workspace-redesign

permissions:
  contents: write

concurrency:
  group: fix-operations-workspace
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Apply verified accessibility and typing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('apps/web/src/globals.css')
          css = css_path.read_text()
          for before, after in {
              '--success: #039855;': '--success: #067647;',
              '--sidebar-faint: #98a2b3;': '--sidebar-faint: #475467;',
          }.items():
              if before in css:
                  css = css.replace(before, after)
              elif after not in css:
                  raise SystemExit(f'neither expected token value is present: {before!r}')
          css_path.write_text(css)

          workspace_path = Path('apps/web/src/views/OperationsWorkspace.tsx')
          workspace = workspace_path.read_text()
          if 'Review approvals' in workspace:
              workspace = workspace.replace('Review approvals', 'Open approval queue')
          elif 'Open approval queue' not in workspace:
              raise SystemExit('approval queue accessible label was not found')

          marker = "const MASTERS_CATEGORIES: readonly { key: MastersTab; label: string }[] = [\n"
          mobile_items = """const MOBILE_MORE_ITEMS = [
            { key: 'quotations', label: 'Quotations', icon: FileText },
            { key: 'approvals', label: 'Approvals', icon: CheckCircle },
            { key: 'serials', label: 'Serial Lookup', icon: Search },
            { key: 'masters', label: 'Masters', icon: Database },
            { key: 'members', label: 'Members', icon: Users },
            { key: 'settings', label: 'Settings', icon: SettingsIcon },
          ] satisfies readonly {
            readonly key: ModuleKey;
            readonly label: string;
            readonly icon: typeof FileText;
          }[];

          """
          if 'const MOBILE_MORE_ITEMS = [' not in workspace:
              if marker not in workspace:
                  raise SystemExit('masters category marker not found')
              workspace = workspace.replace(marker, mobile_items + marker, 1)

          old = """{NAVIGATION.slice(1)
                    .flatMap((group) => group.items)
                    .map((item) => {"""
          new = """{MOBILE_MORE_ITEMS.map((item) => {"""
          if old in workspace:
              workspace = workspace.replace(old, new, 1)
          elif new not in workspace:
              raise SystemExit('mobile navigation item loop not found')

          workspace_path.write_text(workspace)
          PY
      - name: Format changed files
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/src/globals.css \
            apps/web/src/views/OperationsWorkspace.tsx
      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            echo "Branch fixes are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/globals.css apps/web/src/views/OperationsWorkspace.tsx
          git commit -m "fix(web): finish operations workspace validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
