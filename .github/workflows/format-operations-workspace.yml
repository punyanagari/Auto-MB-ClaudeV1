name: Format operations workspace branch

on:
  push:
    branches:
      - agent/operations-workspace-redesign

permissions:
  contents: write

concurrency:
  group: format-operations-workspace
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format the new workspace files
        run: >-
          pnpm exec prettier --write
          apps/web/src/views/OperationsDashboard.tsx
          apps/web/src/views/OperationsWorkspace.tsx
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/views/OperationsDashboard.tsx \
                  apps/web/src/views/OperationsWorkspace.tsx
          git commit -m "style(web): format operations workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
