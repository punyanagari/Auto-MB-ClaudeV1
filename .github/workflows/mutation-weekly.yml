name: Mutation testing (weekly)

# Coverage says a line ran. Mutation testing says an assertion would have
# noticed the line being wrong — which is the only question worth asking of
# the modules that decide money, document numbers and CSRF refusals.
#
# It runs weekly rather than per pull request because it costs one test run
# per mutant: minutes, not seconds, and nothing about it is needed to decide
# whether a change is safe to merge today. It is scoped to four invariant
# modules (apps/server/stryker.config.json explains the choice) so those
# minutes stay in the tens, and it needs no database: the suite it drives is
# apps/server/vitest.mutation.config.ts, four pure unit files.
#
# Weekly, not nightly (owner decision, budget mode): this repository is
# private and two thirds of its monthly Actions allowance is already spent.
# Seven runs a week of a report nobody reads on six of those days is the
# easiest saving available, and the four modules it covers change rarely
# enough that a week is a sensible reporting period. Run it from the Actions
# tab whenever one of them is touched.

on:
  schedule:
    # Sunday 02:00 UTC — the quietest slot in the week, and a day clear of
    # the Monday 03:30 full-topology proof in ci.yml, so the two never
    # contend for runners.
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.16.0
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Stryker is installed here rather than committed to the workspace
      # manifests: it is a periodic diagnostic, not a build dependency, and
      # the root package.json belongs to another change. The resolved
      # versions are printed so a run can be reproduced from its log.
      - name: Install Stryker
        run: |
          pnpm --filter @auto-mb/server add --save-dev \
            @stryker-mutator/core @stryker-mutator/vitest-runner
          pnpm --filter @auto-mb/server exec stryker --version
      - name: Mutation run
        working-directory: apps/server
        run: pnpm exec stryker run stryker.config.json
      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: mutation-report
          path: apps/server/reports/mutation
          if-no-files-found: warn
          retention-days: 14
