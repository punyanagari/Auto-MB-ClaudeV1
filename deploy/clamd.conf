# clamd configuration for the Auto-MB production stack.
#
# WHY THIS FILE EXISTS AT ALL. The clamav/clamav image generates its own
# /etc/clamav/clamd.conf from clamd.conf.sample on first boot, and the
# sample's StreamMaxLength is 25M. Every upload this application scans is
# sent over clamd's INSTREAM protocol (apps/server/src/malware-scan.ts),
# and clamd ABORTS a stream that exceeds StreamMaxLength — which the
# server sees as a failed scan, not a clean one, and turns into a
# SCAN_UNAVAILABLE refusal because scanning fails closed.
#
# The TallyPrime All Masters export is 133 MB (one tag per line, ~165 tags
# per ledger, UTF-16), so under the stock limit that import could never
# succeed in production: not intermittently, every single time. Mounting
# this file is the image's own supported override — the entrypoint skips
# generation when /etc/clamav/clamd.conf already exists — so the settings
# below have to be complete rather than a fragment.
#
# THE THREE LIMITS ARE 256M AGAINST AN APPLICATION CAP OF 192M
# (MAX_TALLY_UPLOAD_BYTES in apps/server/src/upload-guards.ts), and the
# gap is deliberate: the application's own 413 should always be the
# refusal an operator meets, because it names the file and the ceiling.
# A scanner limit BELOW the application's would turn an over-size upload
# into "the scanner is unavailable", which is true, unhelpful, and points
# at the wrong thing. Raise the application cap and this file together, in
# that order.
#
# ⚠ INFRASTRUCTURE. Changing this file changes malware scanning for EVERY
# upload in the product, not only the Tally import. After deploying, prove
# clamd came up and still scans: `docker compose exec clamav clamdcheck.sh`
# must PING, and the EICAR test string must still be refused by an upload
# route (docs/OPERATIONS.md).

# Run in the foreground so the container supervises the process directly.
Foreground yes
LogTime yes

# The signature database lives on the clamav-db volume.
DatabaseDirectory /var/lib/clamav

# The server and worker reach clamd over TCP inside the compose network.
TCPSocket 3310
TCPAddr 0.0.0.0

# See the header. StreamMaxLength is the INSTREAM ceiling and the one that
# was actually biting; MaxFileSize and MaxScanSize bound what clamd will
# read and inspect once the bytes have arrived, and a stream larger than
# either would be truncated rather than scanned.
StreamMaxLength 256M
MaxFileSize 256M
MaxScanSize 256M
