# Production topology for a single India-region host (docs/OPERATIONS.md).
# Copy deploy/.env.production.example to deploy/.env.production, fill it in,
# then from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
name: auto-mb-prod

# Every image carries its DIGEST as well as its tag. A tag is a mutable
# pointer: `clamav/clamav:1.4` today and `clamav/clamav:1.4` next month can
# be different bytes, which makes "the image the scanner passed" and "the
# image serving traffic" two different claims. Renovate moves tag and
# digest together.

# Container logs are the only diagnostic record this deployment keeps
# (docs/RUNBOOK.md §6), and Docker's default json-file driver is unbounded
# — a chatty week fills the 40 GB pilot disk and takes PostgreSQL down with
# it. Capped and rotated for every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: auto_mb
      POSTGRES_USER: auto_mb_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      # Consumed by the init script below when the data volume is first
      # created; the application role must exist before migrations run or
      # every role-guarded grant in them is silently skipped.
      AUTO_MB_APP_DB_PASSWORD: ${AUTO_MB_APP_DB_PASSWORD:?set in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auto_mb_owner -d auto_mb']
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M

  gotenberg:
    image: gotenberg/gotenberg:8.24.0@sha256:b116a40a1c24917e2bf3e153692da5acd2e78e7cd67e1b2d243b47c178f31c90
    restart: unless-stopped
    logging: *logging
    # The same endpoint the API's readiness probe calls. Without it a
    # wedged renderer was only visible as failed challan PDFs.
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Chromium is the memory consumer here; the tax-invoice render
          # path bounds a request to 45s and 20 MiB of PDF
          # (docs/OPERATIONS.md §2).
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M

  clamav:
    image: clamav/clamav:1.4@sha256:7173cd3d57a839c6fee673b07246301e0d1f68f5a14a5ca063f502323bf1cc61
    restart: unless-stopped
    logging: *logging
    volumes:
      - clamav-db:/var/lib/clamav
    # clamdcheck.sh ships in the image and PINGs the daemon. The long
    # start period is the first-boot signature download, which is minutes,
    # not seconds — an interval short enough to be useful afterwards would
    # otherwise mark a healthy container unhealthy on every cold start.
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        limits:
          # clamd holds the whole signature database in memory; below
          # ~1.5 GiB it is killed mid-scan and uploads fail closed.
          cpus: '1.0'
          memory: 2048M
        reservations:
          memory: 1024M

  server:
    # Explicit build tag: the deploy workflow's rollback re-points this
    # exact tag at the image id that was serving before a failed deploy and
    # recreates from it (.github/workflows/deploy.yml). Relying on
    # compose's derived default name would make that restore depend on an
    # undocumented naming convention.
    image: auto-mb-prod-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Pinned to the literal string, never interpolated from the host
      # environment and never left to the image's own ENV alone. The boot
      # gates (AUTH_SECRET length, SMTP settings, CLAMAV_HOST) treat an
      # UNSET NODE_ENV as production and so fail safe, but Better Auth's
      # built-in rate limiter enables itself only when the value is
      # exactly `production` — an empty or misspelt value silently loses a
      # control rather than refusing to start. Same reason the image sets
      # it too: two independent statements of the same fact.
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: postgres://auto_mb_app:${AUTO_MB_APP_DB_PASSWORD:?set in .env.production}@postgres:5432/auto_mb
      AUTH_SECRET: ${AUTH_SECRET:?set in .env.production}
      # Two-factor enforcement for privilege holders (finding 36). Defaults
      # to true in production; set false in .env.production only while the
      # deployment is being stood up, before any partner account exists.
      MFA_ENFORCE: ${MFA_ENFORCE:-true}
      # Password recovery mail (apps/server/src/auth.ts): outside
      # development and test the server refuses to start unless both are
      # set, so compose refuses the interpolation first rather than
      # shipping a container that boot-loops. SMTP_URL may carry mailbox
      # credentials, so like AUTH_SECRET both values come from
      # .env.production and are never committed.
      SMTP_URL: ${SMTP_URL:?set in .env.production}
      MAIL_FROM: ${MAIL_FROM:?set in .env.production}
      WEB_ORIGIN: https://${SITE_ADDRESS:?set in .env.production}
      # The server sits exactly one hop behind Caddy, which replaces any
      # client-supplied X-Forwarded-For with the real peer address; one
      # trusted hop gives the rate limiter true per-client addressing.
      TRUST_PROXY_HOPS: '1'
      OBJECT_STORAGE_DIR: /data/objects
      # PDF signature trust anchors. The image ships the CCA India roots at
      # this path (deploy/Dockerfile.server, deploy/trust-anchors/), so the
      # default needs nothing set. Named here anyway because the quarterly
      # refresh (docs/OPERATIONS.md §8) should not require an image rebuild:
      # mount a host directory over /etc/auto-mb/pdf-trust, or set this to
      # another mounted path, and the server picks it up on restart. A
      # configured-but-unreadable path refuses to boot rather than
      # degrading every railway document to "issuer not checked".
      AUTO_MB_PDF_TRUST_ANCHORS: ${AUTO_MB_PDF_TRUST_ANCHORS:-/etc/auto-mb/pdf-trust}
      GOTENBERG_URL: http://gotenberg:3000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      METRICS_TOKEN: ${METRICS_TOKEN:?set in .env.production}
      # Backup freshness (docs/RUNBOOK.md §4/§6): the nightly host cron
      # writes /var/lib/auto-mb/backup-status/last-success only after a
      # fully verified backup; /metrics surfaces it as the
      # backup_last_success_timestamp_seconds gauge. Absent file simply
      # omits the series.
      BACKUP_MARKER_PATH: /backup-status/last-success
      # Optional Whitebooks transport. Disabled unless explicitly true;
      # credentials remain deployment secrets and are never baked into images.
      WHITEBOOKS_ENABLED: ${WHITEBOOKS_ENABLED:-false}
      WHITEBOOKS_ENVIRONMENT: ${WHITEBOOKS_ENVIRONMENT:-sandbox}
      WHITEBOOKS_EMAIL: ${WHITEBOOKS_EMAIL:-}
      WHITEBOOKS_USERNAME: ${WHITEBOOKS_USERNAME:-}
      WHITEBOOKS_PASSWORD: ${WHITEBOOKS_PASSWORD:-}
      WHITEBOOKS_CLIENT_ID: ${WHITEBOOKS_CLIENT_ID:-}
      WHITEBOOKS_CLIENT_SECRET: ${WHITEBOOKS_CLIENT_SECRET:-}
      WHITEBOOKS_EWAY_CLIENT_ID: ${WHITEBOOKS_EWAY_CLIENT_ID:-}
      WHITEBOOKS_EWAY_CLIENT_SECRET: ${WHITEBOOKS_EWAY_CLIENT_SECRET:-}
      WHITEBOOKS_IP_ADDRESS: ${WHITEBOOKS_IP_ADDRESS:-}
      WHITEBOOKS_GSTIN: ${WHITEBOOKS_GSTIN:-}
      WHITEBOOKS_IRP: ${WHITEBOOKS_IRP:-NIC1}
      WHITEBOOKS_TIMEOUT_MS: ${WHITEBOOKS_TIMEOUT_MS:-10000}
    volumes:
      - objects:/data/objects
      # Marker directory only, read-only — the dumps themselves must never
      # be reachable from the internet-facing app container. A directory
      # (not file) mount so the cron's atomic rename stays visible inside.
      - /var/lib/auto-mb/backup-status:/backup-status:ro
    # Full readiness, the same judgement the deploy gate and the uptime
    # monitor use: every configured dependency answering AND the applied
    # migration ledger matching the migrations this image carries. The
    # start period covers ClamAV's first-boot signature download and the
    # window between `up -d` and the deploy's migration step, during which
    # the schema-version gate legitimately refuses.
    #
    # The image has no curl; BusyBox wget is what Alpine ships. `-q -O -`
    # exits nonzero on the 503 that readiness answers with, which is
    # exactly the intended verdict.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/ready >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M

  # --- asynchronous jobs ------------------------------------------------
  # The worker enters the deployed set here, discharging ADR-0008's
  # tripwire: the scaffold was deliberately not deployed until a real job
  # existed, and pack P18's queue (migration 0072) is that job.
  #
  # It runs the SAME image as `server` with a different command, because
  # its runtime needs are the same ones — poppler-utils, the CCA trust
  # anchors, the object-storage volume, the database client. It publishes
  # no port and answers no request.
  worker:
    image: auto-mb-prod-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ['node', 'apps/worker/dist/worker.mjs']
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      # Not a hard dependency for correctness — a job whose Gotenberg call
      # fails simply retries — but starting the worker before its
      # dependencies only produces a burst of avoidable retries.
      gotenberg:
        condition: service_started
    environment:
      NODE_ENV: production
      # The SAME application role as the API, with no additional
      # privilege. ADR-0011's whole decision is that a worker holds nothing
      # a request handler does not: it binds a tenant through
      # `app_private.bind_tenant` like every request, and the membership is
      # re-proved in the database at execution time. A separate role, or
      # this one with BYPASSRLS, would be the bypass ADR-0010 refused.
      DATABASE_URL: postgres://auto_mb_app:${AUTO_MB_APP_DB_PASSWORD:?set in .env.production}@postgres:5432/auto_mb
      # It reads the bytes the API stored, so it mounts the same volume.
      OBJECT_STORAGE_DIR: /data/objects
      # Signature verification runs here now, so the anchors matter here
      # too, and the quarterly refresh in docs/OPERATIONS.md §8 must land
      # on both containers — which is why they read the same variable and
      # the same default path out of the same image.
      AUTO_MB_PDF_TRUST_ANCHORS: ${AUTO_MB_PDF_TRUST_ANCHORS:-/etc/auto-mb/pdf-trust}
      GOTENBERG_URL: http://gotenberg:3000
      # How long a claim is held before it lapses and the job returns to
      # the queue. It must exceed the slowest job comfortably: too short
      # and a healthy worker's job is taken from under it and done twice.
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_IDLE_POLL_MS: ${WORKER_IDLE_POLL_MS:-1000}
    volumes:
      - objects:/data/objects
    # No healthcheck. The worker exposes no endpoint, and a process-liveness
    # probe would report a wedged claim loop as healthy; the queue's own
    # states are the honest signal — a rising `queued` depth or anything in
    # `refused_bind` is what an operator watches (docs/OPERATIONS.md §2).
    deploy:
      resources:
        limits:
          # Poppler and signature verification are CPU-bound, and this is a
          # single pilot host shared with the API. One core keeps a backlog
          # of extractions from starving the request path.
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 192M

  caddy:
    # Same explicit tag rationale as `server` above.
    image: auto-mb-prod-caddy:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging: *logging
    # Deliberately `service_started`, not `service_healthy`: TLS issuance
    # and the static bundle must keep working while the API is still
    # warming up, and a site that answers 502 is far easier to diagnose
    # than a site that answers nothing.
    depends_on:
      - server
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Caddy's admin API listens on loopback only and is never proxied; it
    # is the one endpoint that answers without a certificate or a Host
    # header, which makes it the honest liveness signal for this container.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:2019/config/ >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  # --- monitoring -------------------------------------------------------
  # Neither service publishes a port. Both are reached over an SSH tunnel
  # (docs/RUNBOOK.md §6); an alerting stack exposed to the internet is a
  # second attack surface carrying a complete map of the first.
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    restart: unless-stopped
    logging: *logging
    depends_on:
      - server
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Bounded retention: this is a 40 GB pilot host, and metrics older
      # than a fortnight have never been needed to answer an incident.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=4GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      # The METRICS_TOKEN as a file. Created once on the host; rotation is
      # docs/RUNBOOK.md §6. Never committed, never in the image.
      - /var/lib/auto-mb/prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:9090/-/healthy >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    restart: unless-stopped
    logging: *logging
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Receiver credentials (SMTP password, webhook URL) once an owner has
      # chosen a delivery channel. Empty until then.
      - /var/lib/auto-mb/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:9093/-/healthy >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M

volumes:
  pgdata:
  objects:
  clamav-db:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
