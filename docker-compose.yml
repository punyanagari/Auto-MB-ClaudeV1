services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_mb}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-auto_mb_owner}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-owner-change-me}
      AUTO_MB_APP_DB_PASSWORD: ${AUTO_MB_APP_DB_PASSWORD:-local-app-change-me}
    ports:
      # Loopback only: nothing outside the development host may reach the
      # database directly.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_ADMIN_USER:-auto_mb_owner} -d ${POSTGRES_DB:-auto_mb}',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --api-port=3000
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    ports:
      # Loopback only: Gotenberg is a private rendering service.
      - '127.0.0.1:3001:3000'
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
