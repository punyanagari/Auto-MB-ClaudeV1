packages:
  - 'apps/*'
  - 'packages/*'

# esbuild's postinstall compiles its platform binary; every other dependency
# is denied install-time scripts (pnpm 11 default-deny posture).
allowBuilds:
  esbuild: true

# @fastify/swagger-ui 6.1.0 pins the vulnerable @fastify/static 9.x
# (GHSA-83w8-p2f5-377r, route guard bypass via path traversal). 6.1.1 makes
# the same jump but is younger than the minimum-release-age cooldown; drop
# this override when @fastify/swagger-ui is bumped past 6.1.1.
overrides:
  "@fastify/static": ">=10.1.1"
